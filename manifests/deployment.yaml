apiVersion: apps/v1
kind: Deployment
metadata:
  name: tag-guestbook
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tag-guestbook
  template:
    metadata:
      labels:
        app: tag-guestbook
    spec:
      containers:
        - image: ghcr.io/tagitables/tag-argocd-guestbook:v1
          name: tag-guestbook
          ports:
            - containerPort: 80
